# nixpacks.toml — Railway build configuration

[phases.setup]
nixPkgs = [
  "nodejs_22",
  "pkg-config",
  "cairo",
  "pango",
  "libpng",
  "libjpeg",
  "giflib",
  "librsvg",
  "pixman",
  "python3",
  "gcc",
  "gnumake"
]

[phases.install]
# npm ci reads the lockfile exactly — no resolution, much less memory than npm install.
# --ignore-scripts stops fix_all.cjs from spawning a nested npm install (the original crash).
# NODE_OPTIONS caps the V8 heap so Railway's build container isn't OOM-killed.
cmds = [
  "NODE_OPTIONS='--max-old-space-size=512' npm ci --ignore-scripts --no-audit --no-fund"
]

# Install mias bot deps + gktw in a separate phase so each npm run starts
# with a clean memory state instead of stacking on top of the root install.
[phases.mias]
cmds = [
  "cd mias && NODE_OPTIONS='--max-old-space-size=512' npm install --ignore-scripts --no-audit --no-fund --loglevel=error || true",
  "cd mias && npm install @itsreimau/gktw --no-audit --no-fund --save-optional 2>/dev/null || npm install github:itsreimau/gktw --no-audit --no-fund --save-optional 2>/dev/null || echo '[nixpacks] gktw unavailable — Baileys fallback active'"
]

[start]
cmd = "npm start"
