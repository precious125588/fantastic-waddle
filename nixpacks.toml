# nixpacks.toml — Railway build configuration

[phases.setup]
nixPkgs = [
  "nodejs_22",
  "pkg-config",
  "cairo",
  "pango",
  "libpng",
  "libjpeg",
  "giflib",
  "librsvg",
  "pixman",
  "python3",
  "gcc",
  "gnumake"
]

[phases.install]
# --ignore-scripts prevents the postinstall hook (fix_all.cjs) from running
# a nested `npm install` during build — that nested call is what crashes npm
# with "Exit handler never called!". The fix_all.cjs patcher runs at startup
# anyway via: npm start -> node fix_all.cjs && node server.js
cmds = ["npm install --no-audit --no-fund --loglevel=error --ignore-scripts"]

[start]
cmd = "npm start"
