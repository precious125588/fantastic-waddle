# nixpacks.toml — Railway build configuration
# Adds the system libraries required by the native canvas / @napi-rs/canvas
# packages so npm install succeeds in the Railway build environment.

[phases.setup]
nixPkgs = [
  "nodejs_22",
  "pkg-config",
  "cairo",
  "pango",
  "libpng",
  "libjpeg",
  "giflib",
  "librsvg",
  "pixman",
  "python3",
  "gcc",
  "gnumake"
]

[phases.install]
# Use npm install instead of npm ci — more resilient for native module builds
cmds = ["npm install --no-audit --no-fund --loglevel=error"]

[start]
cmd = "npm start"
