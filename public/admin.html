<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAIS MDX Admin Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: #e0e0e0; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; text-align: center; }
    .header h1 { font-size: 28px; margin-bottom: 5px; }
    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
    .section { background: #1a1a1a; border-radius: 8px; padding: 20px; margin-bottom: 20px; border: 1px solid #333; }
    .section h2 { color: #667eea; margin-bottom: 15px; font-size: 20px; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-box { background: #2a2a2a; padding: 15px; border-radius: 6px; border-left: 4px solid #667eea; }
    .stat-box .value { font-size: 24px; font-weight: bold; color: #667eea; }
    .stat-box .label { font-size: 12px; color: #888; margin-top: 5px; }
    .user-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    .user-table th { background: #2a2a2a; padding: 12px; text-align: left; border-bottom: 1px solid #333; }
    .user-table td { padding: 12px; border-bottom: 1px solid #333; }
    .user-table tr:hover { background: #2a2a2a; }
    .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
    .status-connected { background: #4caf50; color: #fff; }
    .status-disconnected { background: #f44336; color: #fff; }
    .status-paused { background: #ff9800; color: #fff; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; margin: 5px; }
    .btn-primary { background: #667eea; color: #fff; }
    .btn-danger { background: #f44336; color: #fff; }
    .btn-success { background: #4caf50; color: #fff; }
    .btn:hover { opacity: 0.9; }
    .login-form { max-width: 300px; margin: 100px auto; background: #1a1a1a; padding: 30px; border-radius: 8px; border: 1px solid #333; }
    .login-form input { width: 100%; padding: 10px; margin-bottom: 10px; background: #2a2a2a; border: 1px solid #333; color: #e0e0e0; border-radius: 4px; }
    .log-stream { background: #0a0a0a; padding: 15px; border-radius: 6px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    .log-entry { padding: 5px 0; border-bottom: 1px solid #333; }
    .log-entry.error { color: #f44336; }
    .log-entry.success { color: #4caf50; }
    .log-entry.info { color: #2196f3; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤖 MAIS MDX Admin Dashboard</h1>
    <p>Manage paired devices & bot sessions</p>
  </div>

  <div class="container" id="dashboard" style="display: none;">
    <div class="section">
      <h2>📊 System Statistics</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="value" id="totalPaired">0</div>
          <div class="label">Paired Devices</div>
        </div>
        <div class="stat-box">
          <div class="value" id="runningBots">0</div>
          <div class="label">Active Bots</div>
        </div>
        <div class="stat-box">
          <div class="value" id="failedPairs">0</div>
          <div class="label">Failed Pairs</div>
        </div>
        <div class="stat-box">
          <div class="value" id="uptime">0h</div>
          <div class="label">Server Uptime</div>
        </div>
      </div>
    </div>

    <div class="section">
      <h2>👥 Paired Users</h2>
      <table class="user-table">
        <thead>
          <tr>
            <th>Phone Number</th>
            <th>Status</th>
            <th>Uptime</th>
            <th>Source</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="userList"></tbody>
      </table>
    </div>

    <div class="section">
      <h2>📜 System Logs</h2>
      <div class="log-stream" id="logStream"></div>
    </div>
  </div>

  <div class="login-form" id="loginForm">
    <h2 style="margin-bottom: 20px; text-align: center;">🔐 Login</h2>
    <input type="text" id="username" placeholder="Username" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary" style="width: 100%;" onclick="login()">Login</button>
    <p id="loginError" style="color: #f44336; margin-top: 10px; text-align: center; display: none;"></p>
  </div>

  <script>
    let adminToken = localStorage.getItem('adminToken');
    let evtSource = null;

    function showDashboard() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadStats();
      loadUsers();
      connectLogs();
    }

    function showLogin() {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const err = document.getElementById('loginError');

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.ok) {
          adminToken = data.token;
          localStorage.setItem('adminToken', adminToken);
          showDashboard();
        } else {
          err.textContent = '❌ ' + (data.error || 'Login failed');
          err.style.display = 'block';
        }
      } catch (e) {
        err.textContent = '❌ Connection error';
        err.style.display = 'block';
      }
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/admin/stats', { headers: { 'x-admin-token': adminToken } });
        const data = await res.json();
        if (data.ok) {
          document.getElementById('totalPaired').textContent = data.totalPaired;
          document.getElementById('runningBots').textContent = data.running;
          document.getElementById('failedPairs').textContent = data.failed;
          document.getElementById('uptime').textContent = Math.floor(data.uptime / 3600) + 'h';
        }
      } catch (e) { console.error(e); }
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/admin/users', { headers: { 'x-admin-token': adminToken } });
        const data = await res.json();
        if (data.ok) {
          const tbody = document.getElementById('userList');
          tbody.innerHTML = data.users.map(u => `
            <tr>
              <td>${u.number}</td>
              <td><span class="status-badge status-${u.running ? 'connected' : u.paused ? 'paused' : 'disconnected'}">${u.running ? '🟢 Active' : u.paused ? '⏸ Paused' : '🔴 Offline'}</span></td>
              <td>${u.uptimeMs ? Math.floor(u.uptimeMs / 1000 / 60) + 'm' : '-'}</td>
              <td>${u.source || 'web'}</td>
              <td>
                <button class="btn btn-primary" onclick="restart('${u.jid}')">Restart</button>
                <button class="btn btn-danger" onclick="deleteUser('${u.jid}')">Delete</button>
              </td>
            </tr>
          `).join('');
        }
      } catch (e) { console.error(e); }
    }

    function connectLogs() {
      if (evtSource) evtSource.close();
      evtSource = new EventSource('/api/admin/logs/stream?token=' + adminToken);
      evtSource.onmessage = (e) => {
        const data = JSON.parse(e.data);
        addLog(data.type || 'info', data.message || JSON.stringify(data));
      };
    }

    function addLog(type, msg) {
      const logStream = document.getElementById('logStream');
      const entry = document.createElement('div');
      entry.className = 'log-entry ' + type;
      entry.textContent = new Date().toLocaleTimeString() + ' [' + type.toUpperCase() + '] ' + msg;
      logStream.appendChild(entry);
      logStream.scrollTop = logStream.scrollHeight;
      if (logStream.children.length > 100) logStream.removeChild(logStream.firstChild);
    }

    async function restart(jid) {
      if (!confirm('Restart this bot?')) return;
      try {
        await fetch(`/api/admin/restart/${encodeURIComponent(jid)}`, { method: 'POST', headers: { 'x-admin-token': adminToken } });
        loadUsers();
        addLog('success', 'Bot restart initiated');
      } catch (e) { console.error(e); }
    }

    async function deleteUser(jid) {
      if (!confirm('Delete this device? This cannot be undone.')) return;
      try {
        await fetch(`/api/admin/user/${encodeURIComponent(jid)}`, { method: 'DELETE', headers: { 'x-admin-token': adminToken } });
        loadUsers();
        addLog('success', 'Device deleted');
      } catch (e) { console.error(e); }
    }

    window.addEventListener('load', () => {
      if (adminToken) showDashboard();
      else showLogin();
    });

    setInterval(loadStats, 5000);
    setInterval(loadUsers, 10000);
  </script>
</body>
</html>
