<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAIS MDX - WhatsApp Bot Pairing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); width: 90%; max-width: 450px; padding: 40px; }
    .logo { text-align: center; margin-bottom: 30px; }
    .logo h1 { color: #667eea; font-size: 32px; margin-bottom: 5px; }
    .logo p { color: #888; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: #333; font-weight: 500; margin-bottom: 8px; }
    .form-group input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 14px; transition: border-color 0.3s; }
    .form-group input:focus { outline: none; border-color: #667eea; }
    .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s; }
    .btn:hover { transform: translateY(-2px); }
    .status { text-align: center; margin-top: 20px; padding: 15px; border-radius: 6px; display: none; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.info { background: #d1ecf1; color: #0c5460; }
    .code-display { background: #f5f5f5; padding: 20px; border-radius: 6px; text-align: center; margin-top: 20px; display: none; }
    .code-display .label { color: #888; font-size: 12px; margin-bottom: 10px; }
    .code-display .code { font-size: 32px; font-weight: bold; color: #667eea; font-family: monospace; letter-spacing: 3px; }
    .progress { width: 100%; height: 4px; background: #e0e0e0; border-radius: 2px; margin-top: 10px; overflow: hidden; }
    .progress-bar { height: 100%; background: #667eea; animation: progress 1s infinite; }
    @keyframes progress { 0% { width: 0; } 100% { width: 100%; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>🤖 MAIS MDX</h1>
      <p>WhatsApp Bot Pairing System</p>
    </div>

    <div id="pairForm">
      <div class="form-group">
        <label for="number">📱 Phone Number</label>
        <input type="tel" id="number" placeholder="234XXXXXXXXXX" maxlength="15">
      </div>
      <button class="btn" onclick="startPair()">🔗 Pair Now</button>
    </div>

    <div id="pairingStatus" class="status"></div>
    <div id="codeDisplay" class="code-display">
      <div class="label">✅ Pairing Code</div>
      <div class="code" id="pairingCode">----</div>
      <p style="margin-top: 15px; color: #666; font-size: 12px;">Enter this code in WhatsApp → Linked Devices</p>
    </div>
  </div>

  <script>
    async function startPair() {
      const number = document.getElementById('number').value.trim();
      if (!number) {
        showStatus('❌ Please enter a phone number', 'error');
        return;
      }

      showStatus('⏳ Connecting to WhatsApp...', 'info');
      document.querySelector('.btn').disabled = true;
      document.getElementById('pairForm').style.display = 'none';

      try {
        const res = await fetch('/api/pair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ number })
        });
        const data = await res.json();

        if (data.ok) {
          showStatus('✅ Code received!', 'success');
          displayCode(data.code);
          if (data.cached) showStatus('ℹ️ Using cached code', 'info');
        } else {
          showStatus('❌ ' + (data.error || 'Pairing failed'), 'error');
          document.getElementById('pairForm').style.display = 'block';
          document.querySelector('.btn').disabled = false;
        }
      } catch (e) {
        showStatus('❌ Connection error', 'error');
        document.getElementById('pairForm').style.display = 'block';
        document.querySelector('.btn').disabled = false;
      }
    }

    function showStatus(msg, type) {
      const el = document.getElementById('pairingStatus');
      el.textContent = msg;
      el.className = 'status ' + type;
      el.style.display = 'block';
    }

    function displayCode(code) {
      document.getElementById('pairingCode').textContent = code;
      document.getElementById('codeDisplay').style.display = 'block';
    }
  </script>
</body>
</html>
