# railway.toml — drop in project root and push to GitHub.
# Railway reads this automatically — no dashboard clicks needed.
#
# [[volumes]] provisions a persistent disk at /app/nexstore so WhatsApp
# sessions (creds.json files) survive every future code push forever.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[volumes]]
mountPath = "/app/nexstore"
