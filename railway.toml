# railway.toml
# Drop this file in your project root and push — Railway reads it automatically.
# The [[volumes]] block tells Railway to create persistent storage for sessions.
# Sessions will survive all future deploys — users never need to re-link again.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType  = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[volumes]]
mountPath = "/app/nexstore"
